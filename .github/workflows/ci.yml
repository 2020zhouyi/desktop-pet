name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  preflight:
    name: npm ci and preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preflight
        run: npm run preflight
